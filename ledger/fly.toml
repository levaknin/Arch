# Fly.io config for the Partner Ledger.
# The app name must be unique across Fly.io; change it here if it is taken.
app = "partner-ledger-c6910c"
primary_region = "sin" # Singapore, closest Fly region to Malaysia

[env]
  PORT = "8080"
  DATA_DIR = "/data"

# SQLite database lives on this volume. One volume = one machine; do not scale out.
[mounts]
  source = "ledger_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
